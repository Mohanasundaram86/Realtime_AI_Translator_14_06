name: Deploy Backend (Lambda + API Gateway)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      stage:
        description: 'Deployment stage'
        required: true
        default: 'prod'
        type: choice
        options: [prod, dev, staging]

env:
  AWS_REGION: ${{ secrets.EXPO_PUBLIC_AWS_REGION }}
  STAGE:      ${{ github.event.inputs.stage || 'prod' }}

jobs:
  deploy-backend:
    name: SAM Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.EXPO_PUBLIC_AWS_REGION }}

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Install Lambda dependencies
        working-directory: backend
        run: npm install --omit=dev

      - name: SAM Build
        working-directory: backend
        run: sam build --use-container

      - name: SAM Deploy
        working-directory: backend
        env:
          USER_POOL_ID:        ${{ secrets.EXPO_PUBLIC_AWS_USER_POOL_ID }}
          USER_POOL_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_AWS_USER_POOL_CLIENT_ID }}
          OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY:  ${{ secrets.ELEVENLABS_API_KEY }}
          AZURE_SPEECH_KEY:    ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          # ElevenLabs/Azure are optional (Default: "" in template.yaml) — `sam deploy
          # --parameter-overrides` rejects a bare `Key=` with no value outright, so any
          # unset optional secret must be OMITTED from the list entirely, not passed empty.
          PARAMS=(
            "Stage=${STAGE}"
            "UserPoolId=${USER_POOL_ID}"
            "UserPoolClientId=${USER_POOL_CLIENT_ID}"
            "TranslationsTable=conversation_history"
            "SettingsTable=user_settings"
            "OpenAIApiKey=${OPENAI_API_KEY}"
          )
          [ -n "$ELEVENLABS_API_KEY" ]  && PARAMS+=("ElevenLabsApiKey=${ELEVENLABS_API_KEY}")
          [ -n "$AZURE_SPEECH_KEY" ]    && PARAMS+=("AzureSpeechKey=${AZURE_SPEECH_KEY}")
          [ -n "$AZURE_SPEECH_REGION" ] && PARAMS+=("AzureSpeechRegion=${AZURE_SPEECH_REGION}")

          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name   ai-translator-stack \
            --resolve-s3 \
            --s3-prefix    ai-translator-stack \
            --region       "${AWS_REGION}" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --parameter-overrides "${PARAMS[@]}"

      - name: Print API base URL
        run: |
          echo "✅ Backend deployed!"
          aws cloudformation describe-stacks \
            --stack-name ai-translator-stack \
            --query "Stacks[0].Outputs[?OutputKey=='ApiBaseUrl'].OutputValue" \
            --output text
